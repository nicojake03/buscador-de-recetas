<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Buscador de Recetas — Gourmet Go</title>


  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-light">


  <header class="py-5 bg-white shadow-sm">
    <div class="container">
      <h1 class="display-5 fw-bold mb-3">Buscador de Recetas</h1>
      <p class="lead text-muted mb-4">Encuentra recetas por ingrediente, estilo o plato. ¡Inspírate y cocina!</p>

      
      <form id="searchForm" class="row g-2 align-items-center" role="search" action="#" method="GET">
        <div class="col-12 col-md-8">
          <label for="q" class="visually-hidden">Buscar por ingrediente</label>
          <input id="q" name="q" type="search" class="form-control form-control-lg" placeholder="Busca por ingrediente...">
        </div>
        <div class="col-12 col-md-4 d-grid">
          <button type="submit" class="btn btn-primary btn-lg">Buscar</button>
        </div>
      </form>
    </div>
  </header>

  
  <main class="container my-5">
    <section id="results" aria-label="Resultados de recetas">
      <h2 class="h4 mb-4">Recetas destacadas</h2>

        <div id="recipesContainer" class="row g-4"></div>
        
    </section>
  </main>

  <footer class="py-4 bg-white border-top">
    <div class="container text-center text-muted small">
      © Gourmet Go — Prototipo visual Sprint 1
    </div>
  </footer>

  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  
  <script src="app.js"></script>
</body>
</html>
